services:
  postgres:
    image: postgres:15-alpine
    container_name: spda_postgres_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: spda_user
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: spda_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
